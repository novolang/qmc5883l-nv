[package]
name        = "qmc5883l-nv"
version     = "0.2.0"
description = "A driver for QST's QMC5883L three-axis magnetometer on an I2C bus: the magnetic field in nanotesla at the 2 and 8 gauss ranges, the output data rates, the oversampling ratios, the data-ready line and the overflow and skipped-data flags, the die temperature as a change, and the chip id, as devices-nv's Magnetometer, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["qmc5883l", "qst", "magnetometer", "compass", "thermometer", "i2c", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/qmc5883l-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

# The package is checked at the embedded tier, the strictest one, so
# every function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading a QMC5883L magnetometer from a device program"

[dependencies]
# The board's I2C bus, GPIO and timer handles, and the I2cBus, GpioOut,
# TimerAsync and AsyncEdge traits.
# A path dependency until 0.4.0 is published: PATH-DEPENDENCIES.md in the
# parent directory lists the line that becomes "^0.4.0".
embedded-hal-nv = "^0.4.0"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Magnetometer, Thermometer and Identifiable traits.
devices-nv      = "^0.4.0"
